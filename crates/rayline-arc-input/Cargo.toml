[package]
name = "rayline-arc-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Turns an Anthropic Messages request into the token ids and readout offsets the ARC encoder reads"
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Lookarounds and a backreference in the environment rules need a
# backtracking engine; this is the one `tokenizers` already brings in.
fancy-regex = "0.17"
# Same pin and pure-Rust regex backend as rayline-tokencount.
tokenizers = { version = "=0.23.2", default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
serde_json.workspace = true
