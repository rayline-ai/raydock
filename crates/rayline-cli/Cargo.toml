[package]
name = "rayline-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rayline public Rust CLI launcher"
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "rayline"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
dirs.workspace = true
minisign-verify = "0.2.5"
rand = "0.9"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = "0.4"
tokio.workspace = true
time = { workspace = true, features = ["parsing"] }
url = "2"
rayline-hf = { path = "../rayline-hf" }
rayline-llama = { path = "../rayline-llama" }
rayline-local-router = { path = "../rayline-local-router" }
rayline-metrics = { path = "../rayline-metrics" }
rayline-subscriptions = { path = "../rayline-subscriptions" }
zstd = "0.13"
toml_edit = "0.25.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
opener = "0.6"

[dev-dependencies]
tempfile = "3"
