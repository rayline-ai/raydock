[package]
name = "rayline-tokencount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Counts a local model's prompt tokens with its published tokenizer and chat template"
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
imagesize = "0.15"
minijinja = { version = "=3.0.5", default-features = false, features = ["builtins", "serde", "loop_controls", "macros", "std_collections", "json"] }
minijinja-contrib = { version = "=3.0.5", default-features = false, features = ["pycompat"] }
sha2 = "0.10"
# fancy-regex (pure Rust) instead of the default C Oniguruma; the
# feature carrying it is named for wasm but only switches the regex engine.
tokenizers = { version = "=0.23.2", default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
